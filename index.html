<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>F1 Dashboard</h1>
    <p>Your Formula 1 data hub</p>
    <h2>2026 Driver Roster</h2>
    <div id="driverRoster"></div>
    <h2>2026 Driver Standings</h2>
    <div id="driverStandings"></div>
    <h2>2026 Constructor Standings</h2>
    <div id="constructorStandings"></div>
    <section id="raceAnalysis">
        <h2>F1 Race Explorer</h2>
        <label for="yearSelect">Select Season:</label>
            <select id="yearSelect">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                 <option value="2024">2024</option>
                 <option value="2023">2023</option>
    </select>
    <label for="raceSelect">Select Grand Prix:</label>

<select id="raceSelect">
    <option value="">Select a race</option>
</select>
        <p id="raceInfo">Loading latest race...</p>
        <div id="raceResults"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
